<style>.blob{animation:drift 18s ease-in-out infinite alternate}.b2{animation-duration:23s;animation-delay:-7s}.b3{animation-duration:29s;animation-delay:-13s}@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(70px,-35px)}100%{transform:translate(-50px,30px)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}@keyframes ping{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.8);opacity:0}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@keyframes caret{0%,23.5%{opacity:1}24%,100%{opacity:0}}@keyframes t0{0%{transform:translateX(0);animation-timing-function:steps(8,end)}10%{transform:translateX(180.8px);animation-timing-function:linear}19%{transform:translateX(180.8px);animation-timing-function:steps(8,end)}23.5%,100%{transform:translateX(0)}}.w0{animation:t0 12s infinite 0s}.c0{animation:caret 12s infinite 0s}@keyframes t1{0%{transform:translateX(0);animation-timing-function:steps(11,end)}10%{transform:translateX(245.6px);animation-timing-function:linear}19%{transform:translateX(245.6px);animation-timing-function:steps(11,end)}23.5%,100%{transform:translateX(0)}}.w1{animation:t1 12s infinite -9s}.c1{animation:caret 12s infinite -9s}@keyframes t2{0%{transform:translateX(0);animation-timing-function:steps(14,end)}10%{transform:translateX(310.4px);animation-timing-function:linear}19%{transform:translateX(310.4px);animation-timing-function:steps(14,end)}23.5%,100%{transform:translateX(0)}}.w2{animation:t2 12s infinite -6s}.c2{animation:caret 12s infinite -6s}@keyframes t3{0%{transform:translateX(0);animation-timing-function:steps(15,end)}10%{transform:translateX(332.0px);animation-timing-function:linear}19%{transform:translateX(332.0px);animation-timing-function:steps(15,end)}23.5%,100%{transform:translateX(0)}}.w3{animation:t3 12s infinite -3s}.c3{animation:caret 12s infinite -3s}@media (prefers-reduced-motion: reduce){*{animation:none!important}.w0{transform:trans