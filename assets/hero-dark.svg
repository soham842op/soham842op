<circle cx="1130" cy="30" r="170" fill="#0047ab"/>
<circle class="orbit" cx="1130" cy="30" r="205" fill="none" stroke="#4b84e8" stroke-opacity="0.45" stroke-dasharray="2 10" stroke-linecap="round"/>
<g class="moon"><circle cx="1130" cy="235" r="7" fill="#4b84e8"/></g>
</g>
<g class="rise"><text x="72" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#8792a5" >Hi, I'm</text><text class="wave" x="158" y="94" font-size="26">👋</text></g>
<g class="rise" style="animation-delay:0.15s"><text x="68" y="180" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" fill="#f2f4f8" letter-spacing="-2">Soham Shah</text></g>
<g clip-path="url(#cl0)"><text x="72" y="228" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" textLength="604.8" lengthAdjust="spacing" xml:space="preserve" fill="#c5ccd8" >I build LLM apps, and then I measure them.</text></g><g class="c0"><g class="w0"><rect class="blink" x="71" y="208.8" width="2.5" height="24" fill="#4b84e8"/></g></g><g clip-path="url(#cl1)"><text x="72" y="228" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" textLength="460.8" lengthAdjust="spacing" xml:space="preserve" fill="#c5ccd8" >Right now: RAG, evals and MLOps.</text></g><g class="c1"><g class="w1"><rect class="blink" x="71" y="208.8" width="2.5" height="24" fill="#4b84e8"/></g></g><g clip-path="url(#cl2)"><text x="72" y="228" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" textLength="460.8" lengthAdjust="spacing" xml:space="preserve" fill="#c5ccd8" >Open to AI/ML, DS and SWE roles.</text></g><g class="c2"><g class="w2"><rect class="blink" x="71" y="208.8" width="2.5" height="24" fill="#4b84e8"/></g></g>
<rect class="rise" style="animation-delay:0.4s" x="72" y="258" width="1056" height="1" fill="#1e2633"/>
<g class="rise" style="animation-delay:0.5s"><circle class="ping" cx="76" cy="295" r="4" fill="#4b84e8"/><circle cx="76" cy="295" r="4" fill="#4b84e8"/><text x="88" y="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#8792a5" letter-spacing="1.5">CURRENTLY</text><text x="72" y="330" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#f2f4f8" >Open to AI/ML, DS and SWE roles</text></g><g class="rise" style="animation-delay:0.6s"><text x="442" y="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#8792a5" letter-spacing="1.5">STUDIED</text><text x="442" y="330" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#f2f4f8" >MS CS, Arizona State, 2026</text></g><g class="rise" style="animation-delay:0.7s"><text x="812" y="300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#8792a5" letter-spacing="1.5">FOCUS</text><text x="812" y="330" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#f2f4f8" >LLM apps, RAG, evals, MLOps</text></g>
