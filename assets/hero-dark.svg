<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Soham Shah. I build LLM apps, and then I measure them.">
<style>.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.wave{transform-box:fill-box;transform-origin:70% 80%;animation:wave 3s ease-in-out infinite}@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}.orbit{transform-box:view-box;transform-origin:1130px 30px;animation:spin 60s linear infinite}.moon{transform-box:view-box;transform-origin:1130px 30px;animation:spin 14s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}@keyframes caret{0%,31%{opacity:1}31.5%,100%{opacity:0}}@keyframes t0{0%{transform:translateX(0);animation-timing-function:steps(42,end)}11%{transform:translateX(610.8px);animation-timing-function:linear}27%{transform:translateX(610.8px);animation-timing-function:steps(42,end)}31%,100%{transform:translateX(0)}}.w0{animation:t0 15s infinite 0s}.c0{animation:caret 15s infinite 0s}@keyframes t1{0%{transform:translateX(0);animation-timing-function:steps(32,end)}11%{transform:translateX(466.8px);animation-timing-function:linear}27%{transform:translateX(466.8px);animation-timing-function:steps(32,end)}31%,100%{transform:translateX(0)}}.w1{animation:t1 15s infinite -10s}.c1{animation:caret 15s infinite -10s}@keyframes t2{0%{transform:translateX(0);animation-timing-function:steps(32,end)}11%{transform:translateX(466.8px);animation-timing-function:linear}27%{transform:translateX(466.8px);animation-timing-function:steps(32,end)}31%,100%{transform:translateX(0)}}.w2{animation:t2 15s infinite -5s}.c2{animation:caret 15s infinite -5s}@media (prefers-reduced-motion: reduce){*{animation:none!important}.w0{transform:translateX(610.8px)}.c1{opacity:0}.c2{opacity:0}}</style>
<defs><clipPath id="frame"><rect width="1200" height="360" rx="10"/></clipPath><clipPath id="cl0"><rect class="w0" x="-538.8" y="204" width="610.8" height="36"/></clipPath><clipPath id="cl1"><rect class="w1" x="-394.8" y="204" width="466.8" height="36"/></clipPath><clipPath id="cl2"><rect class="w2" x="-394.8" y="204" width="466.8" height="36"/></clipPath></defs>
<rect x="0.5" y="0.5" width="1199" height="359" rx="10" fill="#0a0e17" stroke="#1e2633"/>
