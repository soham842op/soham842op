<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="LiveDocs: Realtime collaborative editor with a Gemini copilot that answers with citations (pgvector). 97.1% hit@1 on a 40-question retrieval benchmark (100% hit@5). Built with Next.js · FastAPI · Postgres + pgvector · AWS S3.">
<style>.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.draw{transform-box:fill-box;transform-origin:left;animation:draw 1.4s .5s cubic-bezier(.6,0,.2,1) both}@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}.nudge{animation:nudge 2.6s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}.bob{transform-box:fill-box;transform-origin:center;animation:bob 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
