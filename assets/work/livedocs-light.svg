<text x="36" y="138" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#2b3240" >Realtime collaborative editor with a Gemini</text><text x="36" y="165" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#2b3240" >copilot that answers with citations (pgvector).</text>
<text x="36" y="202" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6475" >Next.js · FastAPI · Postgres + pgvector · AWS S3</text></g>
